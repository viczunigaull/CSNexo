# Puerto del microservicio
server.port=8080

# Base de datos H2 en memoria (se reinicia al apagar el servicio)
spring.datasource.url=jdbc:h2:mem:csnexo
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA crea las tablas automáticamente desde las entidades
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

# Consola H2 para inspeccionar la base en http://localhost:8080/h2-console
spring.h2.console.enabled=true
